<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 8 · Decisions and Messages</title>
<meta name="description" content="INE 315 Week 8: if/elif decisions and sending your first message, one card at a time.">
<style>

  --line:#e0dfda; --line-soft:#eceae5; --code-bg:#f7f6f3; --com:#8a8880;

  --ok:#1e7a4b; --ok-soft:rgba(30,122,75,.10); --bad:#b0382a; --bad-soft:rgba(176,56,42,.09);
  --amber:#c77a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
    --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
    --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
    --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
    --amber:#e0a94a;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1e1e23; --panel-2:#26262c; --ink:#f0efea; --ink-2:#d2d1ca; --ink-3:#9a998f;
  --line:#33333a; --line-soft:#2a2a30; --code-bg:#1a1a20; --com:#807f76;
  --red:#D0655A; --red-soft:rgba(208,101,90,.14); --blue:#5BA3D6; --blue-soft:rgba(91,163,214,.14);
  --ok:#4cb07a; --ok-soft:rgba(76,176,122,.14); --bad:#e06a5a; --bad-soft:rgba(224,106,90,.14);
  --amber:#e0a94a;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:86px}
code,pre,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
code{background:var(--panel-2); border-radius:5px; padding:1px 5px; font-size:.88em}
kbd{background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:.82em}
b{font-weight:700}
.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.in{max-width:1180px; margin:0 auto; padding:9px 16px; display:flex; gap:12px; align-items:center}
.brand{font-weight:700; font-size:.9rem; white-space:nowrap}
.brand span{color:var(--red)}
.chips{display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:99px; padding:4px 12px;
  font:inherit; font-size:.8rem; white-space:nowrap; cursor:pointer}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.chip.sep{cursor:default; border-style:dashed; color:var(--ink-3); font-weight:700; background:transparent}
.tools{display:flex; gap:8px; align-items:center}
.tbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:8px; padding:4px 10px; font:inherit; font-size:.78rem; cursor:pointer}
.timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:.85rem; color:var(--ink-3); display:none; cursor:pointer}
.timer.on{display:inline}
.timer.up{color:var(--red)}
main{max-width:1180px; margin:0 auto; padding:22px 16px 0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 28px; animation:in .18s ease-out}

.ctype{display:flex; gap:10px; align-items:center; font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:8px}
.pill{border-radius:99px; padding:3px 10px; background:var(--panel-2); color:var(--ink-2)}
.pill.blue{background:var(--blue-soft); color:var(--blue)}
.pill.green{background:var(--ok-soft); color:var(--ok)}
.pill.red{background:var(--red-soft); color:var(--red)}
h1{font-size:clamp(1.7rem,3.6vw,2.3rem); line-height:1.15; margin:.1em 0 .3em}
h2{font-size:clamp(1.25rem,2.6vw,1.7rem); line-height:1.2; margin:.1em 0 .45em}
h3{font-size:1rem; margin:.2em 0 .3em}
p.lead{color:var(--ink-2); margin:.2em 0 1em}
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:26px}
.two.wide-left{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
@media (max-width:820px){ .two,.two.wide-left{grid-template-columns:minmax(0,1fr); gap:16px} }
ul.points{margin:.2em 0; padding:0; list-style:none}
ul.points li{position:relative; padding-left:1.7em; margin:.55em 0}
ul.points li::before{counter-increment:p; content:counter(p); position:absolute; left:0; top:.15em; width:1.15em; height:1.15em;
  border-radius:50%; background:var(--red-soft); color:var(--red); font-size:.72em; font-weight:800; display:grid; place-items:center}
ul.points{counter-reset:p}
.notebox{margin-top:14px; background:var(--panel-2); border-radius:12px; padding:11px 15px; font-size:.93rem}
.tag{font-size:.66rem; font-weight:800; letter-spacing:.08em; border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:middle;
  background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}
.tag.PYTHON{background:var(--red-soft); color:var(--red); border-color:var(--red)}
pre.code{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:13px; padding:12px 0; font-size:.9rem; line-height:1.65; overflow-x:auto}
pre.code.big{font-size:.95rem}
.ln{display:block; padding:0 16px 0 0; white-space:pre}
.ln .no{display:inline-block; width:2.4em; padding-right:.9em; text-align:right; color:var(--ink-3); opacity:.6; user-select:none}
.ln.click{cursor:pointer}
.ln.click:hover{background:var(--panel-2)}
.ln.cur{background:var(--blue-soft)}
.ln.right{background:var(--ok-soft)} .ln.wrong{background:var(--bad-soft)}
.tk-kw{color:var(--red); font-weight:700} .tk-str{color:var(--blue)} .tk-num{color:var(--amber)}
.tk-com{color:var(--com); font-style:italic} .tk-fn{color:var(--blue)}
.opts{display:grid; gap:9px}
.opt{display:flex; gap:11px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--panel);
  border-radius:12px; padding:10px 13px; font:inherit; cursor:pointer; color:var(--ink)}
.opt:hover{border-color:var(--ink-3)}
.opt .l{font-weight:800; color:var(--ink-3)}
.opt pre{margin:0; font-size:.86rem; white-space:pre-wrap; word-break:break-word}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .l{color:var(--ok)}
.opt.dim{opacity:.45}
.reveal{max-height:0; overflow:hidden; opacity:0; transition:max-height .25s ease,opacity .25s ease}
.reveal.show{max-height:2200px; opacity:1; margin-top:14px}
.cap{font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:800; margin:10px 0 5px}
pre.out{margin:0; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:10px 14px;
  font-size:.9rem; white-space:pre; overflow-x:auto; min-height:2.4em}
pre.out.empty{color:var(--ink-3); font-style:italic}
.ask{font-size:.9rem; color:var(--ink-3); margin-top:10px}
.btn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 15px; font:inherit; cursor:pointer}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff; font-weight:700}
.btn.blue{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700}
.btn.sm{padding:5px 11px; font-size:.86rem}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.stepinfo{font-size:.85rem; color:var(--ink-3)}
.note{background:var(--panel-2); border-left:3px solid var(--red); border-radius:0 10px 10px 0; padding:10px 14px; font-size:.94rem; min-height:3.2em}
table.vars{width:100%; border-collapse:collapse; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem}
table.vars td{padding:4px 8px; border-bottom:1px dotted var(--line-soft)}
table.vars td:first-child{color:var(--ink-2); width:45%}
table.vars td:last-child{color:var(--red); font-weight:700}
table.vars tr.chg td{background:var(--red-soft)}
.frame{border:1px solid var(--line); border-radius:11px; padding:7px 9px; margin-bottom:9px; background:var(--panel)}
.frame .fh{font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:800; margin-bottom:3px}
.pz{display:grid; gap:6px; margin-top:8px; overflow-x:auto}
.pzl{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:5px 10px; background:var(--panel)}
.pzl.ok{border-color:var(--ok); background:var(--ok-soft)} .pzl.no{border-color:var(--bad); background:var(--bad-soft)}
.pzl .ctl{display:flex; gap:4px}
.pzl .ctl button{width:26px; height:26px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:7px; cursor:pointer; font-size:.8rem}
.pzl .txt{flex:1; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem; white-space:pre}
.pzl .mark{font-weight:800; width:1em}
.fb{margin-top:10px; font-size:.95rem}
.errline{margin-top:12px; background:var(--bad-soft); border:1px solid var(--bad); border-radius:11px; padding:10px 14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88rem}
.cause{margin-top:12px; background:var(--panel-2); border-radius:12px; padding:12px 15px; font-size:.94rem}
.exp{margin-top:12px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
.exp .box{border-radius:11px; padding:8px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.87rem; white-space:pre-wrap}
.exp .want{background:var(--ok-soft); border:1px solid var(--ok)}
.exp .got{background:var(--bad-soft); border:1px solid var(--bad)}
.exp .k{display:block; font-family:inherit; font-size:.66rem; letter-spacing:.07em; text-transform:uppercase; font-weight:800; color:var(--ink-3); margin-bottom:2px}
.cls{display:grid; gap:8px; margin-top:8px}
.clrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:11px; padding:8px 13px; background:var(--panel)}
.clrow.ok{border-color:var(--ok); background:var(--ok-soft)} .clrow.no{border-color:var(--bad); background:var(--bad-soft)}
.clrow .cli{flex:1; min-width:150px}
.clb{display:flex; gap:6px; flex-wrap:wrap}
.binb{font:inherit; font-size:.82rem; border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2); border-radius:99px; padding:4px 12px; cursor:pointer}
.binb.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.clrow .mark{font-weight:800; width:1em}
.ftab{width:100%; border-collapse:collapse; font-size:.94rem; margin-top:10px}
.ftab td{padding:7px 10px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.ftab{table-layout:fixed}
.ftab td:first-child{width:40%}
.ftab td:last-child{overflow-wrap:anywhere}
.ftab td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue); font-size:.86rem}
.ftab th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:4px 10px; border-bottom:1px solid var(--line)}
.etab,.sum{width:100%; border-collapse:collapse; font-size:.94rem}
.etab th,.sum th{text-align:left; font-size:.68rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); padding:6px 9px; border-bottom:1px solid var(--line)}
.etab td,.sum td{padding:8px 9px; border-bottom:1px solid var(--line-soft); vertical-align:top}
.etab td:last-child{color:var(--ink-3)}
.sum td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--blue)}
.sum td{overflow-wrap:anywhere}
.chatbar{display:flex; gap:12px; align-items:center; background:var(--panel-2); border-radius:12px; padding:11px 15px; margin-top:16px; font-size:.93rem}
.exlist{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:6px}
.ex{border:1px solid var(--line); border-radius:12px; padding:11px 15px; background:var(--panel); min-width:0}
.ex .h{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.ex .id{font-weight:800; color:var(--red)}
.ex .kind{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; font-weight:800; border-radius:6px; padding:2px 7px; background:var(--panel-2); color:var(--ink-3)}
.ex .task{margin:6px 0 0; font-size:.94rem; color:var(--ink-2)}
.star{font-size:.72rem; color:var(--amber); font-weight:700}
.session{min-height:58vh; display:flex; flex-direction:column; justify-content:center}
.banner{display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--red); color:#fff; border-radius:99px; padding:4px 14px; margin-bottom:12px}
.banner.s2{background:var(--blue)}
.recap{background:var(--panel-2); border-radius:12px; padding:12px 16px; margin:10px 0 16px; font-size:.95rem}
.demolist{display:grid; gap:8px; margin-top:6px}
.demolist div{border:1px solid var(--line); border-radius:10px; padding:8px 12px; background:var(--panel)}
.rhythm{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); gap:10px; margin-top:18px}
.rh{border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--panel)}
.rh .k{font-size:.7rem; font-weight:800; color:var(--red)}
.rh .t{font-weight:700; font-size:.95rem}
.rh .d{font-size:.84rem; color:var(--ink-3)}
.hint{font-size:.83rem; color:var(--ink-3); margin-top:6px}
.tasks{margin:10px 0 0; padding-left:1.2em; font-size:.95rem}
.tasks li{margin:5px 0}
.livecode{margin:0; background:var(--code-bg); border:1px solid var(--line); border-radius:12px; padding:11px 15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.86rem; white-space:pre-wrap; word-break:break-word; line-height:1.6}
.livecode .res{color:var(--red); font-weight:700}
.livecode .cm{color:var(--com); font-style:italic}
.livecode .on{color:var(--ok); font-weight:700}
/* --- live widgets --- */
.panelbox{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--panel); min-width:0}
.panelbox h4{margin:0 0 8px; font-size:.95rem}
.panelbox.bad{border-color:var(--bad)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 12px}
.push{border:1px solid var(--line); border-radius:12px; padding:9px 14px; font:inherit; font-weight:700; font-size:.86rem;
  background:var(--panel-2); color:var(--ink-2); cursor:pointer; user-select:none}
.push.on{color:#fff}
.push.estop.on{background:var(--red); border-color:var(--red)}
.push.stop.on{background:var(--ink-3); border-color:var(--ink-3)}
.push.start.on{background:var(--ok); border-color:var(--ok)}
.lamp{display:flex; gap:10px; align-items:center; font-weight:700; font-size:.9rem}
.bulb{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:var(--panel-2)}
.bulb.lit{background:var(--amber); border-color:var(--amber); box-shadow:0 0 14px var(--amber)}
.codeline{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.83rem; padding:2px 6px; border-radius:6px; white-space:pre}
.codeline.hit{background:var(--blue-soft)}
.codeline.dead{opacity:.4}
.sl{display:grid; grid-template-columns:6.4em minmax(0,1fr) 4em; gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.sl input[type=range]{width:100%; accent-color:var(--blue)}
.sl b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; text-align:right}
.tin{display:grid; grid-template-columns:6.4em minmax(0,1fr); gap:10px; align-items:center; margin:8px 0; font-size:.9rem}
.tin input[type=text],.tin input[type=number]{font:inherit; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9rem;
  padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); color:var(--ink); width:100%}
.console{background:#14141a; color:#e8e7e1; border-radius:12px; padding:10px 13px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.82rem; line-height:1.55; height:210px; overflow-y:auto; border:1px solid var(--line)}
.console .t{color:#8fb7d8} .console .m{color:#e8e7e1} .console .me{color:#f0b429; font-weight:700} .console .sys{color:#8a8880; font-style:italic}
svg.dg{display:block; width:100%; height:auto}
svg.dg .bx{fill:var(--panel-2); stroke:var(--line); stroke-width:1.5}
svg.dg .bx.acc{fill:var(--red-soft); stroke:var(--red)}
svg.dg .bx.b2{fill:var(--blue-soft); stroke:var(--blue)}
svg.dg .tx{fill:var(--ink); font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .sm{fill:var(--ink-3); font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg.dg .ar{stroke:var(--ink-3); stroke-width:1.6; fill:none; marker-end:url(#ah)}
svg.dg .wire{stroke:var(--ink-2); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; marker-end:none}
svg.dg .wire.rail{stroke-width:3.2}
svg.dg .wire.hot{stroke:var(--red); stroke-width:3}

svg.dg .btnsym{fill:var(--panel-2); stroke:var(--ink-2); stroke-width:2}
svg.dg .dash{fill:none; stroke:var(--line); stroke-width:1.6; stroke-dasharray:7 5}
svg.dg .led{fill:var(--panel-2); stroke:var(--ink-2); stroke-width:2}
svg.dg .led.on{fill:var(--red-soft); stroke:var(--red)}
.figwrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line-soft); border-radius:14px;
  background:var(--panel-2); padding:12px 12px 8px}
.figwrap > svg.dg{min-width:560px}
.figcap{color:var(--ink-3); font-size:.84rem; margin:8px 2px 0; line-height:1.5}
.pintab{width:100%; border-collapse:collapse; font-size:.9rem; margin-top:4px}
.pintab th{text-align:left; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  border-bottom:1px solid var(--line); padding:0 8px 6px 0; font-weight:700}
.pintab td{padding:7px 8px 7px 0; border-bottom:1px solid var(--line-soft); vertical-align:top}
.pintab td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; white-space:nowrap; color:var(--blue); font-weight:600}
.whybox{background:var(--blue-soft); border:1px solid var(--blue); border-radius:12px; padding:11px 14px; margin-top:14px}
.whybox h4{margin:0 0 6px; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--blue)}
.whybox ul{margin:0; padding-left:18px} .whybox li{margin:5px 0; line-height:1.55}

.caution b{color:var(--bad)}
.swipe{display:none}

svg.dg .ar.cmd{stroke:var(--red); stroke-dasharray:6 4}
svg.dg .sm.cmdt{fill:var(--red); font-weight:700}
.nav{position:fixed; left:0; right:0; bottom:0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); z-index:20}

.navbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:9px 18px; font:inherit; font-weight:700; cursor:pointer}
.navbtn.next{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.navbtn:disabled{opacity:.35; cursor:not-allowed}

@media (max-width:700px){ .brand{display:none} .card{padding:18px 15px; border-radius:14px} main{padding:14px 10px 0} }
</style>
</head>

<script>const DATA={"week":{"n":8,"label":"Week 8","brand":"Week 8","title":"Decisions that run machines, and getting a message out","sub":"Two sessions: the if/elif chain, then your first published message","lead":"This week your programs make the kind of decision a machine controller makes, and then send the result to another computer. <b>The factory is the setting; <code>if<\/code>/<code>elif<\/code>, strings and loops are the content.<\/b> Everything about brokers, protocols and wiring is given to you and is not examined.","lesson_label":"Why:"},"exercises":{"demo1_ladder_logic.ipynb":[{"id":"1.1","kind":"Predict","title":"Which branch wins?","task":"<b>Predict first:<\/b> the emergency stop and the start button are both pressed. What is <code>motor_on<\/code> at the end? Put your answer in <code>my_prediction<\/code>, then run.","star":false},{"id":"1.2","kind":"Fill in","title":"Complete the chain","task":"Complete <code>motor_state<\/code> so it follows the three rules: the emergency stop wins, then stop, then start. Two blanks, both keywords.","star":false},{"id":"1.3","kind":"Write it","title":"Say when nothing matched","task":"Add an <code>else<\/code> branch to <code>motor_state<\/code> that prints <code>\"no button pressed\"<\/code> before returning. The returned value must not change.","star":false},{"id":"1.4","kind":"Fix it","title":"Make the emergency stop win again","task":"This version uses three separate <code>if<\/code>s, so the emergency stop can be defeated. <b>Change as little as possible<\/b> so that it behaves like the chain in 1.2.","star":false},{"id":"1.5","kind":"Write it","title":"A three-level tank alarm","task":"A tank level in percent. Write <code>level_alarm(level)<\/code> returning <code>\"HIGH\"<\/code> above 80, <code>\"LOW\"<\/code> below 20, and <code>\"OK\"<\/code> otherwise. <b>The order of your branches decides whether it works.<\/b>","star":true}],"demo2_first_publisher.ipynb":[{"id":"2.1","kind":"Fill in","title":"Build your topic","task":"Build <code>TOPIC<\/code> from <code>MY_NAME<\/code> with an f-string, so that it reads <code>ine315/&lt;your name>/hello<\/code>.","star":false},{"id":"2.2","kind":"Write it","title":"One topic per machine","task":"Build <code>topic2<\/code> for machine number 7, in the form <code>ine315/&lt;your name>/machine7/temperature<\/code>, using <b>both<\/b> variables.","star":false},{"id":"2.3","kind":"Fill in","title":"Send five messages","task":"Complete the loop so it publishes five messages to <code>TOPIC<\/code>, each one saying <code>hello from &lt;name>, number &lt;i><\/code>.","star":false},{"id":"2.4","kind":"Predict","title":"Take the topic apart","task":"<b>Predict first:<\/b> how many pieces does <code>topic2.split(\"/\")<\/code> give back, and what is the last one? Then run.","star":false},{"id":"2.5","kind":"Write it","title":"One message per machine","task":"You have a list of three machine numbers. Publish one message for each, to <b>its own topic<\/b>, saying <code>machine &lt;n> is running<\/code>.","star":true}]},"sessions":{"1":{"title":"Decisions that run machines","goal":"Read an <code>if<\/code>/<code>elif<\/code> chain and say which branch runs, and why the <b>order<\/b> of the branches is the safety rule.","two":["<code>elif<\/code> means <b>only if nothing above matched<\/b>","<code>while True<\/code> with a <code>sleep<\/code> is the shape of every control program"],"recap":"Before we start: a <b>Boolean<\/b> is a value that is only <code>True<\/code> or <code>False<\/code>. Every comparison you write produces one.","demos":["Demo 1: the motor starter, five lines of Python","Demo 2: the same chain run over six scenarios"],"notebooks":["demo1_ladder_logic.ipynb"]},"2":{"title":"Getting a message out of this computer","goal":"Build a topic with an f-string and publish ten messages to it, and know what <code>publish<\/code> does and does not give you back.","two":["a <b>topic<\/b> is an ordinary string, built with an f-string","<code>publish<\/code> sends text and gives <b>nothing<\/b> back"],"recap":"Last session: <code>if<\/code>/<code>elif<\/code> decides, <code>while True<\/code> repeats. Today the decision is made in one program and the result is sent to another.","demos":["Demo 3: the ten-line publisher","Demo 4: the projector — everyone's messages in one window"],"notebooks":["demo2_first_publisher.ipynb"]}},"blocks":[{"session":1,"id":"A1","short":"Warm-up","title":"Warm-up: True and False","cards":[{"kind":"idea","tag":"PYTHON","title":"A Boolean is a value with only two possibilities","points":["<code>True<\/code> and <code>False<\/code> are values, like <code>7<\/code> or <code>\"M3\"<\/code>. Capital T, capital F.","<b>Every comparison produces one:<\/b> <code>&lt;<\/code>, <code>&gt;<\/code>, <code>==<\/code>, <code>!=<\/code>, <code>&gt;=<\/code>, <code>&lt;=<\/code>.","<code>and<\/code> needs both sides True. <code>or<\/code> needs one. <code>not<\/code> flips it.","<b><code>=<\/code> stores a value. <code>==<\/code> asks a question.<\/b> That one character is the most common mistake in this room."],"code":"stock = 40\n\nlow = stock < 50          # a comparison, so low is a Boolean\nprint(low)                # True\nprint(type(low))          # <class 'bool'>"},{"kind":"predict","question":"Three comparisons on one line. What prints?","code":"x = 7\nprint(x > 5, x == 5, x != 5)","options":["7 5 5","True False False","True False True","True True False"],"explain":"Each comparison is worked out separately and prints as <code>True<\/code> or <code>False<\/code>. <code>x == 5<\/code> asks a question and the answer is no; <code>x != 5<\/code> asks the opposite and the answer is yes.","answer":2,"output":"True False True"},{"kind":"predict","question":"Now the three words that combine Booleans.","code":"a = True\nb = False\nprint(a and b, a or b, not a)","options":["an error","False True False","True False True","False False True"],"explain":"<code>and<\/code> needs <b>both<\/b> sides True, so it is False. <code>or<\/code> needs <b>one<\/b>, so it is True. <code>not<\/code> flips the value it is given.","answer":1,"output":"False True False"},{"kind":"classify","title":"True or False?","bins":["True","False"],"task":"Click each expression until it is in the right box, then press <b>Check<\/b>.","items":["3 > 3","3 >= 3","\"a\" == \"a\"","not True","5 != 5","(2 > 1) and (1 > 2)"],"after":"<b>Watch the two easy traps.<\/b> <code>&gt;<\/code> is not <code>&gt;=<\/code>: 3 is not greater than itself, but it is greater than <i>or equal to<\/i> itself. And <code>and<\/code> fails as soon as one side is False, however obvious the other side looks.","answers":[1,0,0,1,1,1]}]},{"session":1,"id":"A2","short":"The chain","title":"The motor starter: five lines that matter","cards":[{"kind":"idea","tag":"GIVEN","title":"Every automation program is the same three steps","visual":"loop","points":["<b>Read<\/b> the inputs: buttons, sensors, a message from somewhere else.","<b>Decide<\/b> what the outputs should be.","<b>Write<\/b> the outputs: a motor, a valve, a lamp, another message. Then do it again.","A controller costing 3000 AED runs this loop. So does ten lines of Python."],"note":"<b>The rules of a motor starter, given to you:<\/b> if the emergency stop is pressed the motor is off, whatever else is true. Otherwise, if the stop button is pressed the motor is off. Otherwise, if the start button is pressed the motor is on. <b>Nothing about motors is examined.<\/b>"},{"kind":"demo","title":"Demo 1: the whole thing, in five lines","code":"emergency_stop = False\nstop_button    = False\nstart_button   = True\n\nmotor_on = False\n\nif emergency_stop:\n    motor_on = False\nelif stop_button:\n    motor_on = False\nelif start_button:\n    motor_on = True\n\nprint(\"Motor on:\", motor_on)","points":["Three Booleans at the top stand for three buttons. Today we set them by hand.","<b>Read <code>elif<\/code> as “only if nothing above matched”.<\/b> Python checks the branches in order and runs <b>at most one<\/b>.","The emergency stop is checked <b>first<\/b>, so it wins over everything below it.","<b>The order of the branches is the safety rule.<\/b> It is not a style choice."],"output":"Motor on: True"},{"kind":"trace","title":"Step through it: stop and start both pressed","code":"emergency_stop = False\nstop_button    = True\nstart_button   = True\n\nmotor_on = False\n\nif emergency_stop:\n    motor_on = False\nelif stop_button:\n    motor_on = False\nelif start_button:\n    motor_on = True\n\nprint(\"Motor on:\", motor_on)","steps":[{"line":1,"kind":"line","note":"The emergency stop is not pressed.","g":{"emergency_stop":"False"},"fn":null,"loc":null,"out":""},{"line":2,"kind":"line","note":"The stop button is pressed.","g":{"emergency_stop":"False","stop_button":"True"},"fn":null,"loc":null,"out":""},{"line":3,"kind":"line","note":"The start button is pressed too.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True"},"fn":null,"loc":null,"out":""},{"line":5,"kind":"line","note":"The motor starts off.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":""},{"line":7,"kind":"line","note":"Is emergency_stop True? <b>False<\/b>. So Python moves to the next branch.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":""},{"line":9,"kind":"line","note":"Is stop_button True? <b>True<\/b>. This branch wins.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":""},{"line":10,"kind":"line","note":"Set motor_on to False.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":""},{"line":14,"kind":"line","note":"<b>The third branch was never looked at.<\/b> Start was pressed, and it made no difference.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":"Motor on: False\n"},{"line":null,"kind":"end","note":"Finished. The output box shows exactly what Python printed.","g":{"emergency_stop":"False","stop_button":"True","start_button":"True","motor_on":"False"},"fn":null,"loc":null,"out":"Motor on: False\n"}]},{"kind":"predict","question":"Nothing is pressed. What happens to <code>motor_on<\/code>?","code":"emergency_stop = False\nstop_button    = False\nstart_button   = False\n\nmotor_on = True          # the motor was already running\n\nif emergency_stop:\n    motor_on = False\nelif stop_button:\n    motor_on = False\nelif start_button:\n    motor_on = True\n\nprint(\"Motor on:\", motor_on)","options":["Motor on: None","an error","Motor on: True","Motor on: False"],"explain":"<b>No branch matched, so nothing ran and no error was raised.<\/b> <code>motor_on<\/code> keeps the value it already had. For a motor that is exactly right — you do not want it stopping when nobody touches anything. In most other code it is a silent bug: <b>an <code>if<\/code>/<code>elif<\/code> chain with no <code>else<\/code> can quietly do nothing.<\/b>","answer":2,"output":"Motor on: True"},{"kind":"classify","title":"Which branch wins?","bins":["motor on","motor off","unchanged"],"task":"For each set of buttons, decide what the five-line chain does. <b>unchanged<\/b> means no branch matched.","items":["e-stop off, stop off, start ON","e-stop off, stop ON, start ON","e-stop ON, stop off, start ON","e-stop off, stop off, start off","e-stop ON, stop ON, start ON","e-stop off, stop ON, start off"],"after":"<b>Read the chain from the top and stop at the first True.<\/b> The emergency stop wins whenever it is pressed, the start button only wins when both branches above it failed, and when nothing is pressed the chain does nothing at all.","answers":[0,1,1,2,1,1]},{"kind":"bug","title":"One word changed, and the emergency stop stops working","code":"emergency_stop = True\nstart_button   = True\n\nmotor_on = False\n\nif emergency_stop:\n    motor_on = False\nif start_button:\n    motor_on = True\n\nprint(\"Motor on:\", motor_on)","expected":"Motor on: False","line":8,"cause":"<b><code>elif<\/code> became a second <code>if<\/code>, so every branch runs, every time.<\/b> The first one turns the motor off; the second one turns it straight back on, because the last line to run wins. The emergency stop is held down and the motor is running. <b>This is the difference between a working E-stop and an injury<\/b>, and it is one keyword.","got":"Motor on: True"},{"kind":"live","mode":"ladder","title":"Press the buttons yourself","tasks":["Press <b>START<\/b>. Then press <b>E-STOP<\/b> as well. Which branch runs in each version?","Find a combination where the two versions <b>disagree<\/b>. How many are there?","Release everything. Why does the left-hand motor keep its state, while the right-hand one does not?"]},{"kind":"wiring","title":"The same five lines, on a real board","sub":"Three buttons and one LED. <b>Six wires in total<\/b> &mdash; and the wiring is given to you, exactly like the formulas.","figures":[{"diagram":"wire1","caption":"Each button sits between its GPIO pin and the ground rail. The LED hangs off GPIO 2 through a resistor and comes back to the same rail. Nothing connects to 3.3 V."}],"pinhead":"Six wires","pincols":["from","to"],"pins":[["GPIO 12","one leg of the <b>E-STOP<\/b> button"],["E-STOP, other leg","GND"],["GPIO 14","one leg of the <b>STOP<\/b> button, other leg to GND"],["GPIO 27","one leg of the <b>START<\/b> button, other leg to GND"],["GPIO 2","220 &#937; resistor, then the <b>long<\/b> leg of the LED"],["LED, short leg","GND"]],"why":["<b>Every button goes to GND, never to 3.3 V.<\/b> The pin is already held high from the inside, so the button only has to pull it down. One wire each, and no way to short the supply.","<b>The resistor is not optional.<\/b> An LED has almost no resistance of its own. Without the 220 &#937; it draws more current than the pin can give, and you damage the LED, the pin, or both.","<b>The LED only works one way round.<\/b> Long leg towards the resistor and the pin, short leg to GND. Backwards it simply stays dark, with no error to tell you.","<b>Everything shares one GND.<\/b> A signal is a voltage <i>difference<\/i>. Without a common return there is nothing to measure it against, and readings become meaningless."],"caution":"<b>Two warnings.<\/b> GPIO 12 must never be wired to 3.3 V &mdash; the board reads that pin as it starts up and may refuse to boot. And on most DevKit boards GPIO 2 is already connected to the small blue LED, so you can run this with no LED wired at all.","note":"<b>None of this is examined.<\/b> The wiring, the pin numbers and the <code>Pin<\/code> calls are given to you, in the same way the control-chart constants were given in Week 6. What is examined is the <code>if<\/code>/<code>elif<\/code> chain in the middle."},{"kind":"wiring","title":"Why a pressed button reads 0","sub":"This is the one piece of electricity worth knowing, because it explains a line of the given code.","figures":[{"diagram":"wire1b","caption":"Left: nothing is pressed, so the only path is up through the internal resistor to 3.3 V and the pin reads 1. Right: the button closes a direct path to GND, which beats the resistor, and the pin reads 0."}],"whyhead":"Reading it back into the code","why":["<code>Pin.PULL_UP<\/code> is what switches that internal resistor on. It is inside the chip &mdash; you never wire it.","Open button &rarr; the pin sees 3.3 V &rarr; <code>pin.value()<\/code> is <code>1<\/code>. Closed button &rarr; the pin is joined to GND &rarr; <code>pin.value()<\/code> is <code>0<\/code>.","So <b>pressed is the low reading<\/b>. Engineers call this <i>active low<\/i>, and it is the normal way to wire a button.","Leave out <code>PULL_UP<\/code> and an open pin is connected to nothing at all. It then picks up whatever is in the air and flickers between 0 and 1 on its own."],"code":"def pressed(pin):\n    \"\"\"True when the button is pressed.\"\"\"\n    return pin.value() == 0","codecap":"The given helper, now readable","note":"This one function is why the rest of your program can say <code>if emergency_stop:<\/code> and mean it. <b>It turns an electrical fact into an English word,<\/b> so the <code>if<\/code>/<code>elif<\/code> chain stays about the decision and not about volts."}]},{"session":1,"id":"A3","short":"Repeating","title":"Doing it forever, and doing it safely","cards":[{"kind":"idea","tag":"PYTHON","title":"A control program repeats until somebody stops it","points":["<code>while True:<\/code> — repeat the indented block forever. There is no counter and no end condition.","<code>time.sleep(1.0)<\/code> — wait one second, so the loop does not run a million times a minute.","<b>Everything the loop does is indented under it.<\/b> A line at the left margin runs once, after the loop ends — which, here, is never.","In Colab you stop it with the square stop button. On a machine it runs for months."],"code":"import time\n\nwhile True:\n    # 1. read the inputs\n    # 2. decide with if / elif\n    # 3. write the outputs\n    time.sleep(1.0)"},{"kind":"puzzle","task":"The three steps happen <b>every pass<\/b>. The summary line prints <b>once<\/b>, after the loop.","lines":["while True:","emergency_stop = read_button()","if emergency_stop:","motor_on = False","else:","motor_on = True","time.sleep(1.0)","print(\"loop finished\")"],"levels":[0,1,1,2,1,2,1,0]},{"kind":"demo","title":"Demo 2: the same chain, six scenarios, one loop","code":"scenarios = [\n    (False, False, True),      # start pressed\n    (False, True,  True),      # stop and start pressed\n    (True,  False, True),      # e-stop and start pressed\n    (False, False, False),     # nothing pressed\n]\nmotor_on = False\n\nfor s in scenarios:\n    emergency_stop = s[0]\n    stop_button    = s[1]\n    start_button   = s[2]\n    if emergency_stop:\n        motor_on = False\n    elif stop_button:\n        motor_on = False\n    elif start_button:\n        motor_on = True\n    print(emergency_stop, stop_button, start_button, \"->\", motor_on)","points":["<b>The chain did not change.<\/b> Only the values fed into it did.","A list of tuples is a neat way to write down test cases. <code>s[0]<\/code>, <code>s[1]<\/code>, <code>s[2]<\/code> unpack one case.","<b>Look at the last line of the output.<\/b> Nothing is pressed, no branch matched, and the motor keeps the state it had from the line above.","This is how you test a decision rule without any hardware: feed it every case you can think of and read the table."],"output":"False False True -> True\nFalse True True -> False\nTrue False True -> False\nFalse False False -> False"},{"kind":"error","code":"EMERGENCY_STOP = True\n\nif emergency_stop:\n    print(\"motor stopped\")","cause":"<b>Python is case-sensitive.<\/b> <code>EMERGENCY_STOP<\/code> and <code>emergency_stop<\/code> are two different names, and only the first one exists. The error names the missing one — read it and check your spelling before you change anything else.","etype":"NameError","msg":"name 'emergency_stop' is not defined","line":3},{"kind":"yourturn","minutes":15,"notebook":"demo1_ladder_logic.ipynb","sub":"In Colab, in <code>demo1_ladder_logic.ipynb<\/code>. Replace every <code>___<\/code>, run the cell, and read the last line. <b>Say your prediction out loud before you run.<\/b>","chat":"When you see <b>PASS<\/b>, type <b>done<\/b> in the chat. Stuck on a red error? Paste its <b>last line<\/b> in the chat."},{"kind":"table","title":"What is examinable from Session 1","rows":[["Booleans, comparisons, <code>and<\/code> / <code>or<\/code> / <code>not<\/code>","Ladder logic and PLC programming"],["<code>if<\/code> / <code>elif<\/code> / <code>else<\/code>, and the <b>order<\/b> of the branches","Automation history, SCADA, DCS"],["Saying which branch runs for a given set of inputs","Motor starters and electrical safety"],["Knowing a chain with no <code>else<\/code> can match nothing","Industrial protocol families"],["<code>while True<\/code> and <code>time.sleep<\/code>","Wiring, relays, contactors"],["Reading a <code>NameError<\/code>",""]],"note":"<b>Next session:<\/b> the same decision, but the answer has to reach a different computer. Two new things only — a <b>topic<\/b> and <b>publish<\/b>."}]},{"session":2,"id":"B1","short":"Why a message","title":"One program is not enough","cards":[{"kind":"idea","tag":"IDEA","title":"You cannot call a function on another computer","visual":"net","points":["The sensor is on the machine. The dashboard is in the office. The alert goes to a phone. The record goes to a database.","<b>Inside one program<\/b> you write <code>result = my_function(x)<\/code> and you get an answer back.","<b>Across two programs<\/b> you write <code>client.publish(topic, text)<\/code>. It returns immediately and gives you <b>no answer<\/b>.","Something else, somewhere else, may or may not be listening. <b>That is the whole change.<\/b>"],"note":"A sender posts to a <b>topic<\/b>; whoever is interested has already subscribed. The sender does not know who is listening, and does not wait to find out."},{"kind":"idea","tag":"GIVEN","title":"Four words, and three lines you copy","points":["<b>Broker:<\/b> a server that receives every message and passes it on. We use a free public one.","<b>Topic:<\/b> a text label the message is filed under. <b>It is a plain string.<\/b>","<b>Publish:<\/b> send a message to a topic. <b>Subscribe:<\/b> ask to receive everything on a topic.","<b>That is the entire protocol as far as this course is concerned.<\/b> Quality-of-service levels, retained messages and broker internals are background."],"fhead":["the word","your Python (given)"],"formulas":[["connect to the broker","client.connect(\"test.mosquitto.org\", 1883, 60)"],["send to a topic","client.publish(topic, message)"],["listen to a topic","client.subscribe(topic)"],["close tidily","client.disconnect()"]]},{"kind":"predict","question":"A topic is built like any other string. What prints?","code":"line    = \"A\"\nmachine = 3\n\ntopic = f\"factory/line{line}/machine{machine}/temperature\"\nprint(topic)","options":["an error","factory/lineA/machine3/temperature","factory/line{line}/machine{machine}/temperature","factory/lineA/machine3/temperature/"],"explain":"An <b>f-string<\/b> drops the value of each variable into the text where its name appears in braces. The slashes mean nothing to Python: they are a convention people agreed on so topics read like folders.","answer":1,"output":"factory/lineA/machine3/temperature"},{"kind":"predict","question":"And you can take it apart again.","code":"topic = \"factory/lineA/machine3/temperature\"\nprint(topic.split(\"/\"))","options":["'factory lineA machine3 temperature'","['f', 'a', 'c', 't', 'o', 'r', 'y']","['factory', 'lineA', 'machine3', 'temperature']","['factory/lineA/machine3/temperature']"],"explain":"<code>.split(\"/\")<\/code> cuts the string wherever it finds a slash and gives back a <b>list of strings<\/b>. The slashes themselves are thrown away. This is how a receiver works out which machine a message came from.","answer":2,"output":"['factory', 'lineA', 'machine3', 'temperature']"}]},{"session":2,"id":"B2","short":"Send it","title":"Build a topic, send ten messages","cards":[{"kind":"live","mode":"topic","title":"Build your own topic","tasks":["Type your own name. Watch the topic and the split list change together.","Put a space in your name. Is that still a sensible topic? What would a receiver see?","Change the machine number. Which part of the split list moves?"]},{"kind":"demo","title":"Demo 3: the ten-line publisher","code":"import time\nimport paho.mqtt.client as mqtt\n\nMY_NAME = \"ahmed\"                        # <-- put your own name here\nTOPIC   = f\"ine315/{MY_NAME}/hello\"\n\nclient = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2)\nclient.connect(\"test.mosquitto.org\", 1883, 60)\n\nfor i in range(3):\n    message = f\"hello from {MY_NAME}, number {i}\"\n    client.publish(TOPIC, message)\n    print(\"sent:\", message)\n    time.sleep(1.0)\n\nclient.disconnect()","points":["<b>Nothing here is new Python.<\/b> An import, an f-string, a <code>for<\/code> loop over <code>range<\/code>, and two method calls on an object.","<code>mqtt.Client(...)<\/code> <b>builds an object<\/b>; <code>client.publish(...)<\/code> <b>calls a method<\/b> on it. Same shape as every library you have used.","<b>Use your own name.<\/b> We are all on one public broker, and identical topics collide.","<code>print<\/code> is there so that <b>you<\/b> can see what you sent. The broker says nothing back."],"output":"sent: hello from ahmed, number 0\nsent: hello from ahmed, number 1\nsent: hello from ahmed, number 2"},{"kind":"trace","title":"Step through two passes of the loop","code":"MY_NAME = \"ahmed\"\nTOPIC   = f\"ine315/{MY_NAME}/hello\"\n\nfor i in range(2):\n    message = f\"hello from {MY_NAME}, number {i}\"\n    client.publish(TOPIC, message)\n    print(\"sent:\", message)","steps":[{"line":1,"kind":"line","note":"Your name, as a string.","g":{"MY_NAME":"'ahmed'"},"fn":null,"loc":null,"out":""},{"line":2,"kind":"line","note":"The f-string builds the topic once: ine315/ahmed/hello.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'"},"fn":null,"loc":null,"out":""},{"line":4,"kind":"line","note":"Pass 0 of the loop.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"0"},"fn":null,"loc":null,"out":""},{"line":5,"kind":"line","note":"Build this pass's message: hello from ahmed, number 0.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"0","message":"'hello from ahmed, number 0'"},"fn":null,"loc":null,"out":""},{"line":6,"kind":"line","note":"Send it. <b>publish gives nothing back<\/b> — there is no answer to store.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"0","message":"'hello from ahmed, number 0'"},"fn":null,"loc":null,"out":""},{"line":7,"kind":"line","note":"Print it, so you can see what left your laptop.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"0","message":"'hello from ahmed, number 0'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\n"},{"line":4,"kind":"line","note":"Pass 1 of the loop.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 0'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\n"},{"line":5,"kind":"line","note":"Build this pass's message: hello from ahmed, number 1.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 1'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\n"},{"line":6,"kind":"line","note":"Send it. <b>publish gives nothing back<\/b> — there is no answer to store.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 1'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\n"},{"line":7,"kind":"line","note":"Print it, so you can see what left your laptop.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 1'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\nsent: hello from ahmed, number 1\n"},{"line":4,"kind":"line","note":"No values left, so the loop ends.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 1'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\nsent: hello from ahmed, number 1\n"},{"line":null,"kind":"end","note":"Finished. The output box shows exactly what Python printed.","g":{"MY_NAME":"'ahmed'","TOPIC":"'ine315/ahmed/hello'","i":"1","message":"'hello from ahmed, number 1'"},"fn":null,"loc":null,"out":"sent: hello from ahmed, number 0\nsent: hello from ahmed, number 1\n"}]},{"kind":"bug","title":"One missing letter, and the message is nonsense","code":"MY_NAME = \"ahmed\"\n\nmessage = \"hello from {MY_NAME}\"\nprint(\"sent:\", message)","expected":"sent: hello from ahmed","line":3,"cause":"<b>The <code>f<\/code> is missing.<\/b> Without it, Python treats the braces as ordinary characters and sends the words <code>{MY_NAME}<\/code> to the broker. No error, no complaint — just a message nobody can use. <b>An f-string needs the <code>f<\/code> immediately before the quote.<\/b>","got":"sent: hello from {MY_NAME}"},{"kind":"error","code":"MY_NAME = \"ahmed\"\n\nTOPIC = f\"ine315/{my_name}/hello\"\nprint(TOPIC)","cause":"<b>Two different names.<\/b> The variable is <code>MY_NAME<\/code> in capitals; the f-string asks for <code>my_name<\/code>. Python looks for a name it has never seen and stops. The message names the missing variable, which is usually the whole answer.","etype":"NameError","msg":"name 'my_name' is not defined","line":3},{"kind":"live","mode":"publisher","title":"Send them, and watch the room","tasks":["Press <b>Run<\/b>. How long does ten messages at one second take?","Set the wait to 0.1 s. What happens on the projector when thirty students do this at once?","Change the name and run again. Which messages on the projector are yours?"]},{"kind":"predict","question":"Two topics, one capital letter apart. Are they the same topic?","code":"print(\"ine315/Ahmed/hello\" == \"ine315/ahmed/hello\")","options":["True","an error","None","False"],"explain":"<b>A topic is a string, and strings are case-sensitive.<\/b> To the broker these are two completely unrelated topics, so a subscriber on one will never see a message sent to the other — with no error anywhere. <b>Nothing arriving is almost always a topic that does not match.<\/b>","answer":3,"output":"False"},{"kind":"wiring","title":"The same publisher, on the real board at the front","sub":"This is the board I will run in Thonny. The temperature goes out as a message, and a command comes back and the light obeys.","figures":[{"diagram":"wire2","caption":"Three wires for the sensor, two for the LED, and <b>none at all<\/b> for the network &mdash; the radio is inside the chip. The red dashed path is a command travelling back from MQTT Explorer to the light on the desk."}],"pinhead":"Five wires, and the USB cable","pincols":["from","to"],"pins":[["3V3","the DHT11's <b>VCC<\/b> leg"],["GPIO 4","the DHT11's <b>DATA<\/b> leg"],["GND","the DHT11's <b>GND<\/b> leg"],["GPIO 2","220 &#937; resistor, then the <b>long<\/b> leg of the LED"],["LED, short leg","GND"],["USB","the laptop &mdash; power, and the console Thonny prints to"]],"why":["<b>Wi-Fi needs no wiring.<\/b> The radio and its antenna are part of the ESP32 module. Joining a network is three lines of given code, not a connection.","<b>The LED is there so that a message is visible.<\/b> Publishing is silent: nothing comes back and nothing appears on the board. A flash per message is the only evidence you have at the board itself.","<b>The loop never ends.<\/b> A controller is not a script that finishes. Press the red stop button in Thonny when you want it to stop.","<b>You can send a command back.<\/b> From MQTT Explorer, publish <code>on<\/code>, <code>off<\/code> or <code>blink<\/code> to the command topic and the LED on the desk obeys."],"caution":"<b>It runs on a phone hotspot, not on the campus network.<\/b> AUS Wi-Fi asks every device to sign in on a web page, and an ESP32 has no way to do that &mdash; it will sit there retrying for ever and never say why.","code":"import json, time\nimport dht, network\nfrom machine import Pin\nfrom umqtt.simple import MQTTClient\n\nTEAM = \"team7\"\nSSID = \"your hotspot name\"\nPASSWORD = \"your hotspot password\"\n\nsensor = dht.DHT11(Pin(4))\nled = Pin(2, Pin.OUT)\n\nTELEMETRY = \"course/%s/telemetry\" % TEAM\nCOMMAND = \"course/%s/cmd/led\" % TEAM\n\n\ndef on_command(topic, msg):\n    \"\"\"MQTT Explorer sent us something. Do what it says.\"\"\"\n    order = msg.decode().strip().lower()\n    print(\"command:\", order)\n\n    if order == \"on\":\n        led.value(1)\n    elif order == \"off\":\n        led.value(0)\n    elif order == \"blink\":\n        for _ in range(6):\n            led.value(not led.value())\n            time.sleep(0.2)\n\n\n# --- GIVEN: join the hotspot and reach the broker --------------------------\nwifi = network.WLAN(network.STA_IF)\nwifi.active(True)\nwifi.connect(SSID, PASSWORD)\nwhile not wifi.isconnected():\n    time.sleep(0.5)\nprint(\"wifi ok:\", wifi.ifconfig()[0])\n\nclient = MQTTClient(TEAM, \"test.mosquitto.org\", port=1883, keepalive=60)\nclient.set_callback(on_command)\nclient.connect()\nclient.subscribe(COMMAND)\nprint(\"broker ok. publishing to\", TELEMETRY)\n# --- end of GIVEN -----------------------------------------------------------\n\nwhile True:\n    sensor.measure()\n    reading = {\"temp_c\": sensor.temperature(), \"rh_pct\": sensor.humidity()}\n\n    client.publish(TELEMETRY, json.dumps(reading))\n    print(\"sent:\", reading)\n\n    was_on = led.value()           # remember what the last command asked for\n    led.value(1)\n    time.sleep(0.2)\n    led.value(was_on)              # ...and put it back, so \"on\" stays on\n\n    for _ in range(25):            # watch for commands for 5 seconds\n        client.check_msg()\n        time.sleep(0.2)\n","codecap":"MicroPython, in Thonny, on the board at the front","note":"<b>Nothing here is new except the first block.<\/b> The sensor and the Wi-Fi are given, exactly like the control-chart constants in Week 6. What you are responsible for is the rest: a dictionary, a string built from it, a <code>for<\/code> loop, and an <code>if<\/code>/<code>elif<\/code> chain deciding what a command means. <b>Running on a different computer did not change any of that.<\/b>"}]},{"session":2,"id":"B3","short":"Your turn","title":"Your turn, and where this goes next","cards":[{"kind":"classify","title":"Does this line send anything?","bins":["changes nothing outside your program","sends something to the broker","an error"],"task":"Three kinds of line from today's program. Put each one in the right box.","items":["topic = f\"ine315/{MY_NAME}/hello\"","client.publish(TOPIC, message)","message = f\"hello number {i}\"","client.publish(TOPIC)","print(\"sent:\", message)","client.connect(\"test.mosquitto.org\", 1883, 60)"],"after":"<b>Building a string changes nothing outside your program<\/b>, and neither does <code>print<\/code> — it writes to your own screen, which is why we put one next to every publish. Only the two <code>client.<\/code> lines reach the network. <code>client.publish(TOPIC)<\/code> with no message is an error: the method needs both.","answers":[0,1,0,2,0,1]},{"kind":"yourturn","minutes":15,"notebook":"demo2_first_publisher.ipynb","sub":"In Colab, in <code>demo2_first_publisher.ipynb<\/code>. Run the install cell first, then work down. <b>Your name goes in <code>MY_NAME<\/code> before anything else.<\/b>","chat":"Your messages should appear on the projector. If they do not, check the topic — one character is enough to lose them."},{"kind":"table","title":"What is examinable from Session 2","rows":[["Building a string with an f-string","Broker products and cloud platforms"],["<code>.split(\"/\")<\/code> and what it returns","Quality-of-service levels, retained messages"],["Creating an object and calling its methods","TLS, certificates, ports and firewalls"],["Knowing <code>publish<\/code> returns nothing","Which broker to choose, and why"],["A <code>for<\/code> loop over <code>range<\/code> with a <code>sleep<\/code>","Network layers and wireless range"],["Reading a <code>NameError<\/code> in an f-string",""]],"note":"<b>Next week:<\/b> a message that carries <b>three values<\/b> instead of a sentence — a dictionary, and <code>json.dumps<\/code>. Two new things again."}]}],"summary":[["if / elif / else","runs at most one branch, checked from the top"],["while True:","repeats the indented block until you stop it"],["time.sleep(1.0)","waits, so the loop runs a <script>const $ = s => document.querySelector(s);

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ---------------- Python highlighter ---------------- */
const KW=new Set("def class return if elif else for in while and or not True False None import from as pass break continue try except print".split(" "));
const BI=new Set("len range min max sum int float str list dict type enumerate sorted round abs all any zip bool".split(" "));
function hl(line){
  let out=""; const re=/(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g; let m;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="tk-num">${m[3]}</span>`;
    else if(m[4]){ const w=m[4]; out+= KW.has(w)?`<span class="tk-kw">${w}</span>`: BI.has(w)?`<span class="tk-fn">${w}</span>`: w; }
    else out+=esc(m[0]);
  }
  return out;
}
function codeHTML(src,opts={}){
  return `<pre class="code ${opts.big?"big":""}">`+src.split("\n").map((l,i)=>
    `<span class="ln ${opts.click?"click":""}" data-l="${i+1}"><span class="no">${i+1}</span>${hl(l)||" "}</span>`).join("")+`</pre>`;
}

const TIMER={left:0,id:null,paused:false};
function startTimer(min){ const t=$("#timer"); TIMER.left=min*60; TIMER.paused=false; t.classList.add("on"); t.classList.remove("up"); clearInterval(TIMER.id); tick();
  TIMER.id=setInterval(()=>{ if(TIMER.paused) return; TIMER.left--; tick(); if(TIMER.left<=0){ clearInterval(TIMER.id); t.textContent="Time!"; t.classList.add("up"); } },1000); }
function tick(){ const m=Math.floor(TIMER.left/60), s=TIMER.left%60; $("#timer").textContent=`${m}:${String(s).padStart(2,"0")}${TIMER.paused?" ||":""}`; }
$("#timer").onclick=()=>{ if(TIMER.left>0){ TIMER.paused=!TIMER.paused; tick(); } };
$("#timer").ondblclick=()=>{ clearInterval(TIMER.id); $("#timer").classList.remove("on","up"); };

/* a resistor, drawn as a labelled box (the schematic zig-zag is
   harder to read on a projector than a box with its value in it) */
function _res(x, y, w, h, label){
  return `<rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>`
       + `<text class="sm" x="${x + w/2}" y="${y + h/2 + 4}" text-anchor="middle">${label}</text>`;
}

/* the ground symbol: three shrinking bars under a stub */
function _gnd(x, y){
  return `<line class="wire" x1="${x}" y1="${y}" x2="${x}" y2="${y+10}"/>`
       + `<line class="wire" x1="${x-13}" y1="${y+10}" x2="${x+13}" y2="${y+10}"/>`
       + `<line class="wire" x1="${x-8}"  y1="${y+15}" x2="${x+8}"  y2="${y+15}"/>`
       + `<line class="wire" x1="${x-3}"  y1="${y+20}" x2="${x+3}"  y2="${y+20}"/>`;
}

/* a junction dot */
function _dot(x, y){ return `<circle class="jn" cx="${x}" cy="${y}" r="4"/>`; }

/* an LED: a circle with the light-arrows, so it is not mistaken for a button */
function _led(x, y, on){
  return `<circle class="led${on ? " on" : ""}" cx="${x}" cy="${y}" r="15"/>`
       + `<path class="wire" d="M${x+13},${y-13} l9,-9 M${x+18},${y-22} l5,0 M${x+23},${y-22} l0,5"/>`
       + `<path class="wire" d="M${x+16},${y-4} l11,-5 M${x+23},${y-11} l5,2 M${x+28},${y-9} l-2,5"/>`;
}

DIAG.wire1b = () => {
  const W = 760, H = 270;
  const panel = (x0, pressed) => {
    const col = x0 + 92;                 // the vertical wire
    let p = "";
    p += `<rect class="dash" x="${x0}" y="26" width="300" height="128" rx="12"/>`;
    p += `<text class="sm" x="${x0 + 12}" y="46" text-anchor="start">inside the ESP32 &#183; you wire none of this</text>`;
    p += `<text class="tx" x="${col}" y="76" text-anchor="middle">3.3 V</text>`;
    p += `<line class="wire" x1="${col}" y1="84" x2="${col}" y2="100"/>`;
    p += _res(col - 26, 100, 52, 20, "pull-up");
    p += `<line class="wire" x1="${col}" y1="120" x2="${col}" y2="186"/>`;
    p += _dot(col, 140);
    /* the pin, reading its value */
    p += `<line class="wire" x1="${col}" y1="140" x2="${col + 58}" y2="140"/>`;
    p += `<rect class="bx ${pressed ? "acc" : "b2"}" x="${col + 58}" y="122" width="118" height="36" rx="8"/>`;
    p += `<text class="tx" x="${col + 117}" y="145" text-anchor="middle">pin reads ${pressed ? "0" : "1"}</text>`;
    /* the switch, outside the chip */
    if (pressed){
      p += `<line class="wire hot" x1="${col}" y1="186" x2="${col}" y2="214"/>`;
      p += _dot(col, 186); p += _dot(col, 214);
    } else {
      p += _dot(col, 186); p += _dot(col, 214);
      p += `<line class="wire" x1="${col}" y1="186" x2="${col + 34}" y2="170"/>`;
    }
    p += `<text class="sm" x="${col + 44}" y="${pressed ? 204 : 182}" text-anchor="start">${pressed ? "closed" : "open"}</text>`;
    p += _gnd(col, 214);
    p += `<text class="tx" x="${x0 + 150}" y="18" text-anchor="middle">${pressed ? "pressed" : "not pressed"}</text>`;
    p += `<text class="sm" x="${x0 + 150}" y="262" text-anchor="middle">${pressed
          ? "the button joins the pin straight to GND, which wins"
          : "nothing else is connected, so the pull-up holds it high"}</text>`;
    return p;
  };
  return `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="One input line in two states: not pressed, where an internal pull-up resistor holds the pin at 3.3 volts and it reads 1; and pressed, where the button connects the pin to ground and it reads 0.">`
    + panel(30, false) + panel(410, true) + `</svg>`;
};

  s += `<path class="ar" style="marker-end:url(#ahw)" d="M${NX + 70},228 L${NX + 70},270"/>`;
  s += `<rect class="bx b2" x="${NX}" y="274" width="${NW}" height="64" rx="12"/>`;

  s += `<text class="sm" x="${NX + NW/2}" y="318" text-anchor="middle">on the laptop</text>`;

function varsTable(vars,prev){
  const keys=Object.keys(vars||{});
  if(!keys.length) return `<div style="padding:6px 8px" class="stepinfo">(nothing yet)</div>`;
  return `<table class="vars">`+keys.map(k=>{ const ch=prev&&JSON.stringify(prev[k])!==JSON.stringify(vars[k]);
    return `<tr class="${ch?"chg":""}"><td>${esc(k)}</td><td>${esc(vars[k])}</td></tr>`; }).join("")+`</table>`;
}
R.trace=(e,card)=>{
  const T=card.c; let i=-1;
  e.innerHTML=head(card,esc(T.title))+
   `<div class="two"><div>${codeHTML(T.code,{big:true})}
     <div class="row" style="margin-top:10px"><button class="btn sm" id="tb">&larr; Step back</button><button class="btn sm primary" id="tn">Step &rarr;</button><button class="btn sm" id="tr">Restart</button><span class="stepinfo" id="ti"></span></div>
     <p class="stepinfo" style="margin-top:8px">The highlighted line has <b>just run</b>.</p></div>
    <div><div class="note" id="tnote"></div><div class="cap">Variables</div><div id="tvars"></div><div class="cap">Output</div><pre class="out" id="tout"></pre></div></div>`;
  const draw=()=>{
    const S=T.steps, s=S[i], p=S[i-1];
    e.querySelectorAll(".code .ln").forEach(l=>l.classList.toggle("cur",!!s&&+l.dataset.l===s.line));
    $("#ti").textContent=`step ${i+1} of ${S.length}`;
    const o=$("#tout");
    if(!s){ $("#tnote").innerHTML="Press <b>Step &rarr;</b> to run the first line."; $("#tvars").innerHTML=`<div class="frame"><div class="fh">Main program</div>${varsTable({},null)}</div>`;
      o.className="out empty"; o.textContent="(nothing printed yet)"; return; }
    $("#tnote").innerHTML=s.note||"&nbsp;";
    let h=`<div class="frame"><div class="fh">Main program</div>${varsTable(s.g,p?p.g:null)}</div>`;
    if(s.fn) h+=`<div class="frame"><div class="fh">Inside ${esc(s.fn)}()</div>${varsTable(s.loc,p&&p.fn===s.fn?p.loc:null)}</div>`;
    $("#tvars").innerHTML=h;
    if(s.out){ o.className="out"; o.textContent=s.out.replace(/\n$/,""); } else { o.className="out empty"; o.textContent="(nothing printed yet)"; }
  };
  const step=d=>{ const j=i+d; if(j<-1||j>=T.steps.length) return false; i=j; draw(); return true; };
  $("#tn").onclick=()=>step(1); $("#tb").onclick=()=>step(-1); $("#tr").onclick=()=>{ i=-1; draw(); };
  draw();
  return {advance(){ return step(1); }, back(){ return step(-1); }};
};

function clickLine(e,answer,onPick){
  let done=false;

  e.querySelectorAll(".code .ln").forEach(x=>x.onclick=()=>pick(+x.dataset.l));
  return {advance(){ if(!done){ pick(0); return true; } return false; }};
}

   `<div class="two wide-left"><div>${codeHTML(D.code)}
     ${D.output!==undefined?`<div class="row" style="margin-top:10px"><button class="btn primary" id="runb">&#9654; Run</button><span class="hint">or press <kbd>&rarr;</kbd></span></div>
      <div class="reveal" id="ro"><div class="cap">Output</div><pre class="out">${esc(D.output)}</pre></div>`:`<p class="hint">${D.hint||"Run it in Colab to see the output."}</p>`}</div>
    <div><ul class="points">${D.points.map(p=>`<li>${p}</li>`).join("")}</ul></div></div>`;
  if(D.output===undefined) return {};
  let shown=false; const show=()=>{ shown=true; $("#ro").classList.add("show"); $("#runb").disabled=true; };
  $("#runb").onclick=show;
  return {advance(){ if(!shown){ show(); return true; } return false; }};
};
R.classify=(e,card)=>{
  const C=card.c, pick=C.items.map(()=>-1); let checked=false;
  e.innerHTML=head(card,esc(C.title),C.task)+
   `<div class="cls">${C.items.map((it,i)=>`<div class="clrow" id="cl${i}"><div class="cli"><code>${esc(it)}</code></div>
      <div class="clb">${C.bins.map((b,j)=>`<button class="binb" data-i="${i}" data-j="${j}">${b}</button>`).join("")}</div><span class="mark" id="cm${i}"></span></div>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="ck">Check</button><button class="btn" id="sa">Show the answer</button><button class="btn" id="rs2">Reset</button></div>
    <div class="fb" id="fb"></div><div class="reveal" id="af"><div class="notebox">${C.after}</div></div>`;
  const paint=()=>{ C.items.forEach((_,i)=>{ e.querySelectorAll(`.binb[data-i="${i}"]`).forEach(b=>b.classList.toggle("on",+b.dataset.j===pick[i]));
    const ok=pick[i]===C.answers[i]; $("#cl"+i).classList.toggle("ok",checked&&ok); $("#cl"+i).classList.toggle("no",checked&&pick[i]>=0&&!ok);
    $("#cm"+i).textContent=checked?(ok?"✓":(pick[i]<0?"?":"✗")):""; }); };
  e.querySelectorAll(".binb").forEach(b=>b.onclick=()=>{ pick[+b.dataset.i]=+b.dataset.j; checked=false; $("#fb").textContent=""; paint(); });
  const done=()=>{ checked=true; paint(); const n=C.items.filter((_,i)=>pick[i]===C.answers[i]).length;
    $("#fb").innerHTML= n===C.items.length?`<b style="color:var(--ok)">All ${n} right.</b>`:`<b style="color:var(--bad)">${n} of ${C.items.length} right.</b> Look again at the ones marked &#10007;.`;
    if(n===C.items.length) $("#af").classList.add("show"); };
  $("#ck").onclick=done;
  $("#sa").onclick=()=>{ C.answers.forEach((a,i)=>pick[i]=a); checked=true; paint(); $("#fb").textContent="The answer."; $("#af").classList.add("show"); };
  $("#rs2").onclick=()=>{ pick.fill(-1); checked=false; $("#fb").textContent=""; $("#af").classList.remove("show"); paint(); };
  paint();
  return {advance(){ if(!checked){ done(); return true; } if(!$("#af").classList.contains("show")){ $("#af").classList.add("show"); return true; } return false; }};
};
R.yourturn=(e,card)=>{
  const c=card.c, X=DATA.exercises[c.notebook]||[], m=c.minutes||12;
  e.innerHTML=head(card,`Your turn: exercises ${X.length?X[0].id+"–"+X[X.length-1].id:""}`,c.sub)+
   `<div class="exlist">${X.map(x=>`<div class="ex"><div class="h"><span class="id">${x.id}</span><span class="kind">${esc(x.kind)}</span><b>${esc(x.title)}</b>${x.star?`<span class="star">&#9733; extra</span>`:""}</div><div class="task">${x.task}</div></div>`).join("")}</div>
   <div class="chatbar"><span>${c.chat}</span><span style="flex:1"></span><button class="btn blue" id="tm">Start ${m}-minute timer</button></div>`;
  $("#tm").onclick=()=>startTimer(m);
};
R.table=(e,card)=>{
  const T=card.c;
  e.innerHTML=head(card,esc(T.title))+`<table class="etab"><thead><tr><th>Examinable · Python</th><th>Not examinable · given</th></tr></thead>
   <tbody>${T.rows.map(([a,b])=>`<tr><td style="color:inherit;font-weight:500">${a}</td><td>${b}</td></tr>`).join("")}</tbody></table>
   <div class="chatbar" style="margin-top:18px"><span>${T.note}</span></div>`;
};
R.summary=(e,card)=>{
  e.innerHTML=head(card,DATA.summary_title)+`<table class="sum"><thead><tr>${DATA.summary_heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
   <tbody>${DATA.summary.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>
   <div class="chatbar" style="margin-top:18px"><span>${DATA.summary_note}</span></div>`;
};

/* ---------------- live cards ---------------- */
R.live=(e,card)=>{
  const L=card.c;
  const sub={ladder:"<b>Press the buttons.</b> Both versions of the chain are re-run every time you press one, with the same three Booleans.",
    topic:"<b>Type in the boxes.</b> The f-string is rebuilt as you type, and split apart again below it.",
    publisher:"<b>Press Run.</b> Nothing leaves this page: it is a simulation of what you and the class will see."}[L.mode];
  if(window.LIVE_STOP) LIVE_STOP();
  e.innerHTML=head(card,esc(L.title),sub)+`<div class="two wide-left"><div id="stageL"></div>
    <div><pre class="livecode" id="lc"></pre><ul class="tasks">${L.tasks.map(t=>`<li>${t}</li>`).join("")}</ul>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="rs">Start again</button></div></div></div>`;
  live8(L,$("#stageL"));
};
function live8(L,box){
  if(L.mode==="ladder"){
    let est=false,stp=false,srt=false,mA=false,mB=false;
    const codeA=['if emergency_stop:','    motor_on = False','elif stop_button:','    motor_on = False','elif start_button:','    motor_on = True'];
    const codeB=['if emergency_stop:','    motor_on = False','if stop_button:','    motor_on = False','if start_button:','    motor_on = True'];
    box.innerHTML=`<div class="btnrow">
        <button class="push estop" id="b1">E-STOP</button>
        <button class="push stop" id="b2">STOP</button>
        <button class="push start" id="b3">START</button></div>
      <div class="two" style="gap:14px">
        <div class="panelbox"><h4>with <code>elif</code></h4><div id="ca"></div><div class="lamp" style="margin-top:10px"><span class="bulb" id="la"></span><span id="ta"></span></div></div>
        <div class="panelbox bad"><h4>with three separate <code>if</code>s</h4><div id="cb"></div><div class="lamp" style="margin-top:10px"><span class="bulb" id="lb"></span><span id="tb2"></span></div></div>
      </div>`;
    const draw=()=>{
      // version A: elif chain
      let hitA=-1;
      if(est){ mA=false; hitA=0; } else if(stp){ mA=false; hitA=2; } else if(srt){ mA=true; hitA=4; }
      // version B: three separate ifs, every line runs
      const hitB=[]; if(est){ mB=false; hitB.push(0);} if(stp){ mB=false; hitB.push(2);} if(srt){ mB=true; hitB.push(4);}
      $("#ca").innerHTML=codeA.map((l,i)=>`<div class="codeline ${hitA===i||hitA===i-1?"hit":(hitA>=0&&i>hitA+1?"dead":"")}">${hl(l)}</div>`).join("");
      $("#cb").innerHTML=codeB.map((l,i)=>`<div class="codeline ${hitB.includes(i)||hitB.includes(i-1)?"hit":""}">${hl(l)}</div>`).join("");
      $("#la").className="bulb"+(mA?" lit":""); $("#lb").className="bulb"+(mB?" lit":"");
      $("#ta").textContent="motor_on = "+(mA?"True":"False")+(hitA<0?"  (no branch matched)":"");
      $("#tb2").textContent="motor_on = "+(mB?"True":"False")+(hitB.length>1?"  (the last one won)":"");
      ["b1","b2","b3"].forEach((id,i)=>$("#"+id).classList.toggle("on",[est,stp,srt][i]));
      const dis = mA!==mB;
      $("#lc").innerHTML=`emergency_stop = <span class="res">${est?"True":"False"}</span>
stop_button    = <span class="res">${stp?"True":"False"}</span>
start_button   = <span class="res">${srt?"True":"False"}</span>

<span class="cm"># with elif  -> at most ONE branch runs</span>
print("Motor on:", motor_on)   <span class="res">${mA?"True":"False"}</span>

<span class="cm"># with three ifs -> EVERY line runs, last one wins</span>
print("Motor on:", motor_on)   <span class="res">${mB?"True":"False"}</span>
${dis?'\n<span class="res">The two versions disagree. The emergency stop is held\ndown and the motor on the right is running.</span>':'\n<span class="cm"># the two versions agree on these inputs</span>'}`;
    };
    $("#b1").onclick=()=>{ est=!est; draw(); }; $("#b2").onclick=()=>{ stp=!stp; draw(); }; $("#b3").onclick=()=>{ srt=!srt; draw(); };
    $("#rs").onclick=()=>{ est=stp=srt=false; mA=mB=false; draw(); };
    draw(); return;
  }
  if(L.mode==="topic"){
    let name="ahmed", machine=3;
    box.innerHTML=`<div class="panelbox">
      <div class="tin"><span>MY_NAME</span><input type="text" id="n1" value="ahmed" maxlength="18"></div>
      <div class="tin"><span>machine</span><input type="number" id="n2" value="3" min="1" max="99"></div>
      <div class="cap">the topic your program builds</div>
      <pre class="out" id="tp"></pre>
      <div class="cap">the same string, split on "/"</div>
      <pre class="out" id="sp"></pre></div>`;
    const draw=()=>{
      const topic=`ine315/${name}/machine${machine}/hello`;
      const parts=topic.split("/");
      $("#tp").textContent=topic;
      $("#sp").textContent="["+parts.map(p=>`'${p}'`).join(", ")+"]";
      $("#lc").innerHTML=`MY_NAME = <span class="res">"${name}"</span>
machine = <span class="res">${machine}</span>

TOPIC = f"ine315/{MY_NAME}/machine{machine}/hello"
print(TOPIC)
<span class="res">${topic}</span>

print(TOPIC.split("/"))
<span class="res">[${parts.map(p=>`'${p}'`).join(", ")}]</span>

<span class="cm"># the part in braces is replaced by the value,</span>
<span class="cm"># everything else is copied exactly as typed</span>`;
    };
    $("#n1").oninput=ev=>{ name=ev.target.value; draw(); };
    $("#n2").oninput=ev=>{ machine=ev.target.value; draw(); };
    $("#rs").onclick=()=>{ name="ahmed"; machine=3; $("#n1").value=name; $("#n2").value=machine; draw(); };
    draw(); return;
  }
  if(L.mode==="publisher"){
    let count=10, wait=1.0, name="ahmed", t=null, i=0;
    const others=["fatima","omar","layla","yousef","mariam"];
    box.innerHTML=`<div class="panelbox">
        <div class="tin"><span>MY_NAME</span><input type="text" id="n1" value="ahmed" maxlength="18"></div>
        <div class="sl"><span>range(n)</span><input type="range" id="s1" min="1" max="20" step="1" value="10"><b id="v1">10</b></div>
        <div class="sl"><span>sleep (s)</span><input type="range" id="s2" min="0.1" max="2" step="0.1" value="1"><b id="v2">1.0</b></div>
        <div class="row" style="margin:6px 0 10px"><button class="btn primary sm" id="go">&#9654; Run</button><button class="btn sm" id="stopb">Stop</button>
          <span class="hint" id="eta"></span></div>
        <div class="cap">the projector at the front of the room</div>
        <div class="console" id="con"></div></div>`;
    const line=(t,m,mine)=>{ const c=$("#con"); const d=document.createElement("div");
      d.innerHTML=`<span class="t">${esc(t)}</span> <span class="${mine?"me":"m"}">${esc(m)}</span>`; c.appendChild(d); c.scrollTop=c.scrollHeight; };
    const reset=()=>{ clearInterval(t); t=null; i=0; $("#con").innerHTML=`<div class="sys">waiting for messages...</div>`;
      $("#eta").textContent=`${count} messages, ${wait.toFixed(1)} s apart = ${(count*wait).toFixed(1)} s`; };
    const run=()=>{ clearInterval(t); i=0; $("#con").innerHTML="";
      t=setInterval(()=>{
        if(!document.getElementById("con")){ clearInterval(t); t=null; return; }
        if(i>=count){ clearInterval(t); t=null; line("", "-- your program finished --", false); return; }
        line(`ine315/${name}/hello`, `hello from ${name}, number ${i}`, true);
        if(Math.random()<0.55){ const o=others[Math.floor(Math.random()*others.length)];
          line(`ine315/${o}/hello`, `hello from ${o}, number ${Math.floor(Math.random()*count)}`, false); }
        $("#lc").innerHTML=`TOPIC = f"ine315/{MY_NAME}/hello"

for i in range(${count}):
    message = f"hello from {MY_NAME}, number {i}"
    client.publish(TOPIC, message)      <span class="cm"># returns nothing</span>
    print("sent:", message)
    time.sleep(${wait.toFixed(1)})

<span class="cm"># message ${i} of ${count} has just left your laptop</span>
<span class="res">sent: hello from ${name}, number ${i}</span>`;
        i++;
      }, Math.max(120, wait*700)); };
    $("#n1").oninput=ev=>{ name=ev.target.value||"ahmed"; };
    $("#s1").oninput=ev=>{ count=+ev.target.value; $("#v1").textContent=count; reset(); };
    $("#s2").oninput=ev=>{ wait=+ev.target.value; $("#v2").textContent=wait.toFixed(1); reset(); };
    window.LIVE_STOP=()=>{ clearInterval(t); t=null; };
    $("#go").onclick=run; $("#stopb").onclick=()=>{ clearInterval(t); t=null; line("", "-- stopped --", false); };
    $("#rs").onclick=()=>{ name="ahmed"; count=10; wait=1.0; $("#n1").value=name; $("#s1").value=10; $("#s2").value=1; $("#v1").textContent="10"; $("#v2").textContent="1.0"; reset(); };
    reset();
    $("#lc").innerHTML=`TOPIC = f"ine315/{MY_NAME}/hello"

for i in range(${count}):
    message = f"hello from {MY_NAME}, number {i}"
    client.publish(TOPIC, message)
    print("sent:", message)
    time.sleep(${wait.toFixed(1)})

<span class="cm"># press Run to watch it happen</span>`;
    return;
  }
}

/* ---------------- navigation ---------------- */
const chips=$("#chips");
let ch=`<button class="chip" data-t="welcome"><b>W8</b> Start</button>`;
[1,2].forEach(s=>{ ch+=`<button class="chip sep" data-t="s${s}">&#9656; Session ${s}</button>`;
  DATA.blocks.filter(b=>b.session===s).forEach(b=>ch+=`<button class="chip" data-t="${b.id}">${esc(b.short)}</button>`); });
ch+=`<button class="chip" data-t="summary">Summary</button>`;
chips.innerHTML=ch;
chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t;
  const i=CARDS.findIndex(x=> t==="welcome"?x.type==="welcome": t==="summary"?x.type==="summary":
    (t[0]==="s"&&t.length===2)?(x.type==="session"&&x.session===+t[1]): (x.block&&x.block.id===t)); go(i); });
function go(i){
  if(window.LIVE_STOP){ LIVE_STOP(); window.LIVE_STOP=null; }
  cur=Math.max(0,Math.min(CARDS.length-1,i)); const c=CARDS[cur];
  $("#stage").innerHTML=`<article class="card" id="card"></article>`;
  ctl=R[c.type]($("#card"),c)||{};
  const key=c.type==="welcome"?"welcome":c.type==="summary"?"summary":c.type==="session"?"s"+c.session:c.block.id;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===key));
  const on=chips.querySelector(".chip.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  if(c.block){ const inB=CARDS.filter(x=>x.block===c.block); $("#where").textContent=`Session ${c.session} · ${c.block.short} · ${c.label} · ${inB.indexOf(c)+1} of ${inB.length}`; }
  else $("#where").textContent=c.label;
  $("#prog").style.width=(cur/(CARDS.length-1)*100)+"%";
  $("#prevBtn").disabled=cur===0; $("#nextBtn").disabled=cur===CARDS.length-1;
  history.replaceState(null,"","#"+cur); window.scrollTo(0,0);
}
function next(){ if(ctl.advance&&ctl.advance()) return; if(cur<CARDS.length-1) go(cur+1); }
function prev(){ if(ctl.back&&ctl.back()) return; if(cur>0) go(cur-1); }
$("#nextBtn").onclick=()=>{ if(cur<CARDS.length-1) go(cur+1); };
$("#prevBtn").onclick=()=>{ if(cur>0) go(cur-1); };
document.addEventListener("keydown",ev=>{ if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ ev.preventDefault(); next(); }
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ ev.preventDefault(); prev(); } });
go(parseInt(location.hash.slice(1))||0);
</script>
